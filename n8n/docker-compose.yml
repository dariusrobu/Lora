services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env.n8n
      - .env.bridge
    environment:
      - GENERIC_TIMEZONE=Europe/Bucharest
      - TZ=Europe/Bucharest
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_LISTEN_ADDRESS=127.0.0.1
      - N8N_RESTRICT_FILE_ACCESS_TO=/obsidian
    volumes:
      - n8n_data:/home/node/.n8n
      - "/Users/robu/Library/Mobile Documents/iCloud~md~obsidian/Documents/Lora:/obsidian"

volumes:
  n8n_data:
